server { listen 80; server_name localhost; root /var/www/html/public; index index.php; server_tokens off; resolver 127.0.0.11 valid=10s; set $php_upstream app:9000; location / { try_files $uri $uri/ /index.php?$query_string; } location ~ \.php$ { include fastcgi_params; fastcgi_pass $php_upstream; fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name; } location ~ /\. { deny all; } }
