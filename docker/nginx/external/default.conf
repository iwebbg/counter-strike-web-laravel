server { listen 80 default_server; server_name _; root /var/www/html/public; index index.php; server_tokens off; resolver 127.0.0.11 valid=10s; set $php_upstream app:9000; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options SAMEORIGIN always; location / { try_files $uri $uri/ /index.php?$query_string; } location ~ \.php$ { include fastcgi_params; fastcgi_pass $php_upstream; fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name; fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto; } location ~ /\. { deny all; } }
