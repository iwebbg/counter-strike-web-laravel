name: fragzone-test
services:
  test:
    build: {context: .., dockerfile: docker/php/Dockerfile, target: testing}
    environment: {APP_ENV: testing, APP_DEBUG: "false", DB_CONNECTION: sqlite, DB_DATABASE: ":memory:", CACHE_STORE: array, SESSION_DRIVER: array, QUEUE_CONNECTION: sync}
    networks: [test]
networks: {test: {driver: bridge}}
