name: fragzone-local
services:
  app:
    build: {context: .., dockerfile: docker/php/Dockerfile, target: development}
    restart: unless-stopped
    env_file: [../.env]
    volumes: [..:/var/www/html, composer-vendor:/var/www/html/vendor]
    depends_on: {database: {condition: service_healthy}, redis: {condition: service_healthy}}
    networks: [application]
  nginx:
    image: nginx:1.29-alpine
    container_name: ${NGINX_CONTAINER_NAME:-fragzone-nginx}
    restart: unless-stopped
    ports: ["80:80"]
    volumes: [..:/var/www/html:ro, ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [app]
    networks: [application]
  scheduler:
    build: {context: .., dockerfile: docker/php/Dockerfile, target: development}
    restart: unless-stopped
    env_file: [../.env]
    environment: {CONTAINER_ROLE: scheduler, AUTO_MIGRATE: "false"}
    volumes: [..:/var/www/html, composer-vendor:/var/www/html/vendor]
    depends_on: [database, redis]
    networks: [application]
  database:
    image: mariadb:11.8
    restart: unless-stopped
    environment: {MARIADB_DATABASE: "${DB_DATABASE}", MARIADB_USER: "${DB_USERNAME}", MARIADB_PASSWORD: "${DB_PASSWORD}", MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"}
    volumes: [database-data:/var/lib/mysql]
    healthcheck: {test: [CMD, healthcheck.sh, --connect, --innodb_initialized], interval: 10s, timeout: 5s, retries: 10}
    networks: [application]
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 10s, timeout: 5s, retries: 5}
    networks: [application]
networks: {application: {driver: bridge}}
volumes: {composer-vendor: {}, database-data: {}, redis-data: {}}
